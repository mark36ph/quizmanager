name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths-ignore:
      - "version.json"
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: quizmanager-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $manifest = Get-Content version.json -Raw | ConvertFrom-Json
            $parts = ([string]$manifest.latest_version).Split('.')
            if ($parts.Count -ne 3 -or $parts | Where-Object { $_ -notmatch '^\d+$' }) {
              throw "version.json must contain a three-part numeric version such as 1.0.20"
            }
            $patch = [int]$parts[2] + 1
            $version = "{0}.{1}.{2}" -f $parts[0], $parts[1], $patch
            @{
              latest_version = $version
            } | ConvertTo-Json | Set-Content version.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.json
            git commit -m "Bump version to $version"
            git push origin HEAD:main
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer, for example 1.0.0"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore QuizManager.sln

      - name: Compile release candidate
        run: dotnet build QuizManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/QuizManager.Core.Tests/QuizManager.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish
          src\QuizManager.Desktop\QuizManager.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          --output desktop-build\publish

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Download previous release metadata
        continue-on-error: true
        run: >-
          dotnet tool run vpk --
          download github
          --repoUrl https://github.com/${{ github.repository }}
          --channel win-x64-stable
          --outputDir Releases

      - name: Package Velopack release
        run: >-
          dotnet tool run vpk --
          pack
          --packId QuizManager
          --packVersion ${{ steps.version.outputs.version }}
          --packDir desktop-build\publish
          --mainExe QuizManager.exe
          --packTitle "Factburst Quiz Manager"
          --packAuthors Factburst
          --runtime win-x64
          --channel win-x64-stable
          --outputDir Releases

      - name: Validate installer output
        shell: pwsh
        run: |
          if (@(Get-ChildItem Releases -File -Filter "*Setup.exe").Count -eq 0) { throw "No Windows Setup.exe was produced." }
          if (@(Get-ChildItem Releases -File -Filter "*-full.nupkg").Count -eq 0) { throw "No full update package was produced." }
          if (@(Get-ChildItem Releases -File -Filter "releases.win-x64-stable.json").Count -eq 0) { throw "No stable update feed was produced." }

      - name: Publish GitHub release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool run vpk -- upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token $env:VPK_TOKEN `
            --publish `
            --merge `
            --releaseName "Factburst Quiz Manager ${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}" `
            --targetCommitish "${{ github.sha }}" `
            --channel win-x64-stable `
            --outputDir Releases
